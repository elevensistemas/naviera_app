<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HLS Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0B1120;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .player-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000;
    }
    .spinner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: rgba(11, 17, 32, 0.7);
      color: #94A3B8;
      font-size: 13px;
      gap: 12px;
      z-index: 10;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .spinner-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: rgba(11, 17, 32, 0.9);
      color: #F87171;
      padding: 16px;
      text-align: center;
      z-index: 20;
    }
    .error-overlay.visible {
      display: flex;
    }
    .retry-btn {
      margin-top: 12px;
      padding: 8px 18px;
      background: #0284C7;
      color: #FFF;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #0369A1;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <video id="video" controls autoplay muted playsinline></video>
    <div id="spinner" class="spinner-overlay">
      <div class="spinner"></div>
      <div id="spinnerText">Conectando señal en vivo...</div>
    </div>
    <div id="errorOverlay" class="error-overlay">
      <div id="errorText">No se pudo cargar la transmisión</div>
      <button class="retry-btn" onclick="startStream()">Reintentar conexión</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoSrc = urlParams.get('url');
    const video = document.getElementById('video');
    const spinner = document.getElementById('spinner');
    const spinnerText = document.getElementById('spinnerText');
    const errorOverlay = document.getElementById('errorOverlay');
    const errorText = document.getElementById('errorText');

    let hlsInstance = null;
    let stallNudgeCount = 0;

    function showSpinner(text) {
      if (text) spinnerText.textContent = text;
      spinner.classList.remove('hidden');
    }

    function hideSpinner() {
      spinner.classList.add('hidden');
    }

    function showError(msg) {
      hideSpinner();
      errorText.textContent = msg;
      errorOverlay.classList.add('visible');
    }

    function hideError() {
      errorOverlay.classList.remove('visible');
    }

    video.addEventListener('playing', () => {
      hideSpinner();
      hideError();
      stallNudgeCount = 0;
    });

    video.addEventListener('waiting', () => {
      showSpinner('Buffering señal...');
    });

    video.addEventListener('canplay', () => {
      hideSpinner();
    });

    function startStream() {
      hideError();
      showSpinner('Conectando señal en vivo...');

      if (hlsInstance) {
        try {
          hlsInstance.destroy();
        } catch (e) {}
        hlsInstance = null;
      }

      if (!videoSrc) {
        showError('No se proporcionó URL de transmisión.');
        return;
      }

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          debug: false,
          enableWorker: true,
          lowLatencyMode: false,
          backBufferLength: 30,
          liveSyncDurationCount: 3,
          liveMaxLatencyDurationCount: 8,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 4,
          levelLoadingTimeOut: 15000,
          levelLoadingMaxRetry: 4,
          fragLoadingTimeOut: 20000,
          fragLoadingMaxRetry: 5
        });

        hlsInstance.loadSource(videoSrc);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().catch(function(e) {
            console.log('Autoplay prevented:', e);
            hideSpinner();
          });
        });

        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.warn('Network error encountered, recovering...', data);
                showSpinner('Reconectando red...');
                hlsInstance.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn('Media error encountered, recovering...', data);
                showSpinner('Recuperando sincronización...');
                hlsInstance.recoverMediaError();
                break;
              default:
                console.error('Fatal unrecoverable HLS error:', data);
                showError('Error fatal en la transmisión Ezviz.');
                hlsInstance.destroy();
                break;
            }
          } else if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) {
            console.warn('Buffer stalled, advancing playhead...');
            stallNudgeCount++;
            if (stallNudgeCount > 3) {
              // Si se traba más de 3 veces consecutivas, recuperar media
              hlsInstance.recoverMediaError();
              stallNudgeCount = 0;
            } else if (video.buffered && video.buffered.length > 0) {
              const latestEnd = video.buffered.end(video.buffered.length - 1);
              if (latestEnd > video.currentTime + 0.5) {
                video.currentTime = latestEnd - 0.5;
              }
            }
          }
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
        video.addEventListener('loadedmetadata', function() {
          video.play().catch(function(e) { console.log('Autoplay prevented:', e); });
        });
      } else {
        showError('Tu navegador no soporta streaming HLS.');
      }
    }

    startStream();
  </script>
</body>
</html>
